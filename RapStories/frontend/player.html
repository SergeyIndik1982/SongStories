<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#0A0A0C;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* MAIN */
.player{
  flex:1;
  overflow-y:auto;
  padding:16px;
  padding-bottom:140px; /* space for mini-player */
}

/* COVER */
.player-cover img{
  width:100%;
  max-height:40vh;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:18px;
}

/* INFO */
.player-info{
  text-align:center;
  margin-bottom:16px;
}

.track-title{
  font-size:20px;
  font-weight:600;
  margin-bottom:4px;
}

.track-subtitle{
  font-size:14px;
  opacity:0.7;
}

/* CONTROLS */
.player-controls{
  display:flex;
  justify-content:center;
  gap:24px;
  margin:18px 0;
}

.btn-icon,
.btn-play{
  background:#7E5CFF;
  border:none;
  color:#fff;
  padding:12px 18px;
  border-radius:50px;
  font-size:18px;
  cursor:pointer;
}

.btn-play{
  font-size:22px;
}

/* PROGRESS */
.player-progress input{
  width:100%;
  margin-bottom:18px;
}

/* CREATE STORY BUTTON */
.create-story-btn{
  width:100%;
  background:linear-gradient(135deg,#7E5CFF,#A88BFF);
  border:none;
  color:#fff;
  padding:14px;
  border-radius:16px;
  font-size:16px;
  font-weight:600;
  margin-bottom:22px;
  cursor:pointer;
}

.create-story-btn:active{
  transform:scale(0.98);
}

/* VIDEO SCROLL */
.video-scroll{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.video-item{
  height:30vh;
  border-radius:16px;
  overflow:hidden;
}

.video-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MINI PLAYER */
.mini-player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#16161D;
  padding:12px 16px;
  border-top-left-radius:22px;
  border-top-right-radius:22px;
  display:flex;
  flex-direction:column;
  z-index:1000;
}

.mini-player__content{
  display:flex;
  align-items:center;
}

.mini-player__cover{
  width:50px;
  height:50px;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  margin-right:12px;
}

.mini-player__meta{
  flex:1;
  overflow:hidden;
}

.mini-player__title{
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-player__artist{
  font-size:12px;
  opacity:0.7;
}

.mini-player__controls button{
  background:#7E5CFF;
  border:none;
  color:#fff;
  padding:8px 12px;
  border-radius:50px;
  margin-left:6px;
  cursor:pointer;
}

.mini-player__progress{
  height:4px;
  background:#333;
  margin-top:8px;
  border-radius:2px;
  position:relative;
}

.mini-player__progress-bar{
  height:100%;
  width:0%;
  background:#7E5CFF;
  border-radius:2px;
}
</style>
</head>

<body>

<main class="player">

  <div class="player-cover">
    <img id="coverImg" src="assets/videoplayer1.jpg">
  </div>

  <div class="player-info">
    <h1 class="track-title" id="trackTitle">Birthday Rap</h1>
    <p class="track-subtitle" id="trackSubtitle">AI Rap Generator • 2:45</p>
  </div>

  <div class="player-controls">
    <button class="btn-icon">⏮</button>
    <button class="btn-play" id="playBtn">▶</button>
    <button class="btn-icon">⏭</button>
  </div>

  <div class="player-progress">
    <input type="range" id="progressRange" min="0" max="100" value="0">
  </div>

  <!-- CREATE STORY BUTTON -->
  <button id="createStoryBtn" class="create-story-btn">
    🎬 Create Story
  </button>

  

</main>

<!-- MINI PLAYER -->
<div class="mini-player">
  <div class="mini-player__content">
    <div class="mini-player__cover" id="miniCover"
         style="background-image:url('assets/videoplayer1.jpg')"></div>
    <div class="mini-player__meta">
      <div class="mini-player__title" id="miniTitle">Birthday Rap</div>
      <div class="mini-player__artist" id="miniArtist">AI Rap Generator</div>
    </div>
    <div class="mini-player__controls">
      <button>⏮</button>
      <button id="miniPlayBtn">▶</button>
      <button>⏭</button>
    </div>
  </div>
  <div class="mini-player__progress">
    <div class="mini-player__progress-bar" id="miniProgress"></div>
  </div>
</div>

<script>
/* Get URL Params */
const params = new URLSearchParams(window.location.search);
const title = params.get("title") || "Birthday Rap";
const artist = params.get("artist") || "AI Rap Generator";
const cover = params.get("cover") || "assets/videoplayer1.jpg";

document.getElementById("trackTitle").textContent = title;
document.getElementById("trackSubtitle").textContent = artist + " • 2:45";
document.getElementById("coverImg").src = cover;

document.getElementById("miniCover").style.backgroundImage = `url(${cover})`;
document.getElementById("miniTitle").textContent = title;
document.getElementById("miniArtist").textContent = artist;

/* Audio */
const audio = new Audio("assets/song.mp3");
const playBtn = document.getElementById("playBtn");
const miniPlayBtn = document.getElementById("miniPlayBtn");
const miniProgress = document.getElementById("miniProgress");
const progressRange = document.getElementById("progressRange");

function togglePlay(){
  if(audio.paused){
    audio.play();
    playBtn.textContent="⏸";
    miniPlayBtn.textContent="⏸";
  }else{
    audio.pause();
    playBtn.textContent="▶";
    miniPlayBtn.textContent="▶";
  }
}

playBtn.addEventListener("click", togglePlay);
miniPlayBtn.addEventListener("click", togglePlay);

audio.addEventListener("timeupdate", ()=>{
  const percent = (audio.currentTime/audio.duration)*100;
  miniProgress.style.width = percent+"%";
  progressRange.value = percent;
});

progressRange.addEventListener("input", ()=>{
  audio.currentTime = (progressRange.value/100)*audio.duration;
});

/* Create Story */
document.getElementById("createStoryBtn").addEventListener("click", ()=>{
  const query = new URLSearchParams({title,artist,cover}).toString();
  window.location.href = "createstory.html?"+query;
});

/* Video Autoplay on Scroll */
document.querySelectorAll(".video-item video").forEach(video=>{
  new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){video.play();}
      else{video.pause();}
    });
  },{threshold:0.6}).observe(video);
});
</script>

</body>
</html>
