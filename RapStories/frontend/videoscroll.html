<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stories</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html, body{
  height:100%;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

/* SCROLL CONTAINER */
.video-scroll{
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  padding-bottom:120px; /* space for mini-player */
}

/* VIDEO ITEM */
.video-item{
  position:relative;
  height:100vh;
  scroll-snap-align:start;
}

.video-item video{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 0.4s ease;
}

.video-item video.playing{
  opacity:1;
}

/* OVERLAY TEXT */
.video-overlay{
  position:absolute;
  bottom:100px;
  left:20px;
  color:#fff;
  z-index:10;
}

.video-title{
  font-size:18px;
  font-weight:600;
  margin-bottom:4px;
}

.video-artist{
  font-size:14px;
  opacity:0.8;
}

/* DASHBOARD BUTTON */
.to-dashboard-btn{
  position:fixed;
  top:20px;
  right:20px;
  z-index:1000;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  color:#fff;
  border:1px solid rgba(255,255,255,0.2);
  padding:10px 16px;
  border-radius:30px;
  font-size:14px;
  cursor:pointer;
}

/* MINI PLAYER */
.mini-player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#16161D;
  padding:12px 16px;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
  display:flex;
  flex-direction:column;
  z-index:1000;
}

.mini-player__content{
  display:flex;
  align-items:center;
}

.mini-player__cover{
  width:50px;
  height:50px;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  margin-right:12px;
}

.mini-player__meta{
  flex:1;
}

.mini-player__title{
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-player__artist{
  font-size:12px;
  opacity:0.7;
}

.mini-player__controls button{
  background:#7E5CFF;
  border:none;
  color:#fff;
  padding:8px 12px;
  border-radius:50px;
  margin-left:6px;
  cursor:pointer;
}

.mini-player__progress{
  height:4px;
  background:#333;
  margin-top:8px;
  border-radius:2px;
}

.mini-player__progress-bar{
  height:100%;
  width:0%;
  background:#7E5CFF;
  border-radius:2px;
}
</style>
</head>

<body>

<button class="to-dashboard-btn" onclick="window.location.href='dashboard.html'">
  Dashboard
</button>

<main class="video-scroll">

  <section class="video-item">
    <video 
      src="assets/story1.mp4"
      poster="assets/videoplayer1.jpg"
      muted
      loop
      playsinline>
    </video>
    <div class="video-overlay">
      <div class="video-title">Birthday Rap</div>
      <div class="video-artist">AI Rap Generator</div>
    </div>
  </section>

  <section class="video-item">
    <video 
      src="assets/story2.mp4"
      poster="assets/videoplayer2.jpg"
      muted
      loop
      playsinline>
    </video>
    <div class="video-overlay">
      <div class="video-title">Wedding Flow</div>
      <div class="video-artist">MC StoryBot</div>
    </div>
  </section>

  <section class="video-item">
    <video 
      src="assets/story3.mp4"
      poster="assets/videoplayer3.jpg"
      muted
      loop
      playsinline>
    </video>
    <div class="video-overlay">
      <div class="video-title">Funny Anniversary</div>
      <div class="video-artist">AI Rap Generator</div>
    </div>
  </section>

</main>

<!-- MINI PLAYER -->
<div class="mini-player">
  <div class="mini-player__content">
    <div class="mini-player__cover"
         style="background-image:url('assets/videoplayer1.jpg')"></div>
    <div class="mini-player__meta">
      <div class="mini-player__title">Midnight Flow</div>
      <div class="mini-player__artist">AI Rap Generator</div>
    </div>
    <div class="mini-player__controls">
      <button>⏮</button>
      <button id="miniPlayBtn">▶</button>
      <button>⏭</button>
    </div>
  </div>
  <div class="mini-player__progress">
    <div class="mini-player__progress-bar" id="miniProgress"></div>
  </div>
</div>

<script>
/* AUTOPLAY + FADE */
document.querySelectorAll(".video-item video").forEach(video=>{
  new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        video.play();
        video.classList.add("playing");
      }else{
        video.pause();
        video.classList.remove("playing");
      }
    });
  },{threshold:0.6}).observe(video);
});

/* MINI PLAYER AUDIO */
const audio = new Audio('assets/song.mp3');
const miniPlayBtn = document.getElementById("miniPlayBtn");
const miniProgress = document.getElementById("miniProgress");

miniPlayBtn.addEventListener("click", ()=>{
  if(audio.paused){
    audio.play();
    miniPlayBtn.textContent="⏸";
  }else{
    audio.pause();
    miniPlayBtn.textContent="▶";
  }
});

audio.addEventListener("timeupdate", ()=>{
  if(audio.duration){
    miniProgress.style.width =
      (audio.currentTime/audio.duration)*100+"%";
  }
});
</script>

</body>
</html>
