<!DOCTYPE html>
<html lang="en">
<head>

<title>Generate Rap</title>
<style>

.container{padding:20px;max-width:400px;margin:0 auto;}

<body>
<div class="container">
<h1>Generate Your Rap</h1>

<select><option>Funny</option><option>Emotional</option><option>Hardcore</option></select>

</form>
